<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Contact Us - ComponentLib</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&amp;display=swap" rel="stylesheet" />
<style>
  :root {
    --color-text-primary: #111827;
    --color-text-secondary: #6b7280;
    --color-bg: #ffffff;
    --color-button-bg: #25D366; /* WhatsApp green */
    --color-button-text: #ffffff;
    --color-phone-bg: #3b82f6; /* Blue for phone */
    --color-email-bg: #ef4444; /* Red for email */
    --container-max-width: 1200px;
    --border-radius: 12px;
    --transition-speed: 0.3s;
    --shadow-light: 0 4px 12px rgba(0,0,0,0.05);
  }

  /* Reset and base */
  *, *::before, *::after {
    box-sizing: border-box;
  }
  body, html {
    margin: 0;
    padding: 0;
    font-family: 'Poppins', sans-serif;
    background-color: var(--color-bg);
    color: var(--color-text-primary);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Container */
  .container {
    max-width: var(--container-max-width);
    margin: 0 auto;
    padding: 4rem 2rem 6rem;
  }

  /* Contact Section */
  section.contact {
    background-color: #f9fafb;
    border-radius: 0.75rem;
    box-shadow: var(--shadow-light);
    padding: 3rem 2rem;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 2rem;
    text-align: center;
  }

  /* Heading */
  section.contact h2 {
    flex-basis: 100%;
    font-weight: 700;
    font-size: 3rem;
    margin-bottom: 1rem;
    color: var(--color-text-primary);
  }

  /* Description */
  section.contact p.description {
    flex-basis: 100%;
    color: var(--color-text-secondary);
    font-size: 1.125rem;
    margin-bottom: 2.5rem;
    max-width: 600px;
    margin-left: auto;
    margin-right: auto;
  }

  /* Contact Methods container */
  .contact-methods {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 2rem;
    width: 100%;
    max-width: 800px;
  }

  /* Individual contact card */
  .contact-card {
    background: white;
    border-radius: 0.75rem;
    box-shadow: var(--shadow-light);
    flex: 1 1 220px;
    padding: 2rem 1.5rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1rem;
    min-height: 280px;
  }

  /* Contact icon container */
  .icon-circle {
    background-color: #e5e7eb;
    border-radius: 50%;
    width: 64px;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--color-text-primary);
    font-size: 2rem;
  }

  /* Phone number */
  .contact-phone {
    font-weight: 600;
    font-size: 1.25rem;
    color: var(--color-text-primary);
  }

  /* Contact email */
  .contact-email {
    font-weight: 600;
    font-size: 1.125rem;
    color: var(--color-text-primary);
    word-break: break-all;
  }

  /* Base button styles */
  .btn-contact {
    margin-top: auto;
    padding: 0.85rem 2rem;
    font-size: 1.125rem;
    font-weight: 600;
    border-radius: 0.75rem;
    border: none;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    text-decoration: none;
    transition: all var(--transition-speed);
    user-select: none;
    color: var(--color-button-text);
  }

  /* WhatsApp button */
  .btn-whatsapp {
    background-color: var(--color-button-bg);
    box-shadow: 0 4px 10px rgba(37, 211, 102, 0.3);
  }
  .btn-whatsapp:hover,
  .btn-whatsapp:focus {
    background-color: #1ebe57;
    box-shadow: 0 6px 14px rgba(37, 211, 102, 0.5);
    outline: none;
  }
  .btn-whatsapp:active {
    background-color: #18ad4d;
    box-shadow: 0 2px 6px rgba(37, 211, 102, 0.2);
  }

  /* Phone button */
  .btn-phone {
    background-color: var(--color-phone-bg);
    box-shadow: 0 4px 10px rgba(59, 130, 246, 0.3);
  }
  .btn-phone:hover,
  .btn-phone:focus {
    background-color: #2563eb;
    box-shadow: 0 6px 14px rgba(59, 130, 246, 0.5);
    outline: none;
  }
  .btn-phone:active {
    background-color: #1d4ed8;
    box-shadow: 0 2px 6px rgba(59, 130, 246, 0.2);
  }

  /* Email button */
  .btn-email {
    background-color: var(--color-email-bg);
    box-shadow: 0 4px 10px rgba(239, 68, 68, 0.3);
  }
  .btn-email:hover,
  .btn-email:focus {
    background-color: #dc2626;
    box-shadow: 0 6px 14px rgba(239, 68, 68, 0.5);
    outline: none;
  }
  .btn-email:active {
    background-color: #b91c1c;
    box-shadow: 0 2px 6px rgba(239, 68, 68, 0.2);
  }

  /* Button icons */
  .btn-contact svg {
    width: 20px;
    height: 20px;
    fill: currentColor;
  }

  /* Home link */
  .home-link {
    margin-top: 2rem;
    text-align: center;
    width: 100%;
  }
  .home-link a {
    color: var(--color-text-secondary);
    text-decoration: none;
    font-weight: 600;
  }
  .home-link a:hover {
    color: var(--color-text-primary);
  }

  /* Responsive */
  @media (max-width: 768px) {
    .contact-methods {
      flex-direction: column;
      max-width: 100%;
    }
    .contact-card {
      flex-basis: 100%;
    }
    section.contact h2 {
      font-size: 2.5rem;
    }
  }
</style>
</head>
<body>
